<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escape Game AR - La Pièce Mystère</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      touch-action: none;
    }
    body {
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 14px 20px;
      background: rgba(18, 14, 12, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 14px;
      color: #e2d1c3;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 10;
      pointer-events: none;
    }
    #status-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 4px;
    }
    #status-desc {
      font-size: 13px;
      color: #cbd5e1;
    }

    #start-btn {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      border-radius: 30px;
      color: #0d0f14;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      z-index: 10;
      pointer-events: auto;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div id="status-title">RECHERCHE EN COURS</div>
    <div id="status-desc">Pointez la caméra vers l'image cible.</div>
  </div>

  <button id="start-btn">DÉMARRER L'EXPÉRIENCE</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const startBtn = document.getElementById('start-btn');

    // 1. INITIALISATION MINDAR
    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind"
    });

    const { renderer, scene, camera } = mindarThree;

    // 2. ÉCLAIRAGE MULTI-DIRECTIONNEL
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
    scene.add(ambientLight);

    const topLight = new THREE.DirectionalLight(0xfff5ea, 2.0);
    topLight.position.set(3, 5, 4);
    scene.add(topLight);

    const bottomLight = new THREE.DirectionalLight(0xffeedd, 2.5);
    bottomLight.position.set(-2, -5, -2);
    scene.add(bottomLight);

    // 3. TEXTURE POUR 3 CHIFFRES SOUS LE SOCLE
    function createBottomNumberTexture(numberStr) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Fond du socle
      ctx.fillStyle = '#1a1815';
      ctx.beginPath();
      ctx.arc(256, 256, 250, 0, Math.PI * 2);
      ctx.fill();

      // Anneau doré
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 16;
      ctx.stroke();

      // Adaptation automatique de la taille de police pour 3 chiffres
      const fontSize = numberStr.length >= 3 ? 135 : 200;
      ctx.fillStyle = '#f3e5ab';
      ctx.font = `Bold ${fontSize}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(numberStr, 256, 256);

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    // 4. CRÉATION DE LA PIÈCE D'ÉCHEC 3D (ROI)
    function createChessPiece(secretNumber) {
      const pieceGroup = new THREE.Group();

      // Profil du Roi
      const points = [];
      points.push(new THREE.Vector2(0.35, 0.00));
      points.push(new THREE.Vector2(0.35, 0.06));
      points.push(new THREE.Vector2(0.31, 0.10));
      points.push(new THREE.Vector2(0.26, 0.14));
      points.push(new THREE.Vector2(0.18, 0.28));
      points.push(new THREE.Vector2(0.16, 0.42));
      points.push(new THREE.Vector2(0.21, 0.50));
      points.push(new THREE.Vector2(0.18, 0.54));
      points.push(new THREE.Vector2(0.15, 0.64));
      points.push(new THREE.Vector2(0.22, 0.74));
      points.push(new THREE.Vector2(0.25, 0.86));
      points.push(new THREE.Vector2(0.18, 0.87));
      points.push(new THREE.Vector2(0.00, 0.87));

      const latheGeo = new THREE.LatheGeometry(points, 32);
      const ivoryMat = new THREE.MeshPhongMaterial({
        color: 0xf4efe6,
        specular: 0xffffff,
        shininess: 80
      });
      const bodyMesh = new THREE.Mesh(latheGeo, ivoryMat);

      // Croix dorée au sommet du Roi
      const crossGroup = new THREE.Group();
      const goldMat = new THREE.MeshPhongMaterial({ color: 0xd4af37, specular: 0xffe090, shininess: 100 });
      const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.16, 0.04), goldMat);
      vBar.position.y = 0.95;
      const hBar = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 0.04), goldMat);
      hBar.position.y = 0.97;
      crossGroup.add(vBar, hBar);

      // Disque sous le socle avec les 3 chiffres
      const bottomGeo = new THREE.CircleGeometry(0.34, 32);
      const numTexture = createBottomNumberTexture(secretNumber);
      const bottomMat = new THREE.MeshBasicMaterial({ map: numTexture, side: THREE.DoubleSide });
      const bottomMesh = new THREE.Mesh(bottomGeo, bottomMat);
      bottomMesh.rotation.x = Math.PI / 2;
      bottomMesh.position.y = 0.001;

      pieceGroup.add(bodyMesh, crossGroup, bottomMesh);

      // Recentrer le pivot
      bodyMesh.position.y = -0.45;
      crossGroup.position.y = -0.45;
      bottomMesh.position.y = -0.45;

      return pieceGroup;
    }

    // CODE SECRET À 3 CHIFFRES (Modifiez "314" par les 3 chiffres de votre choix)
    const SECRET_NUMBER = "314";
    const chessGroup = createChessPiece(SECRET_NUMBER);
    chessGroup.scale.set(0.8, 0.8, 0.8);

    // ANCRAGE MINDAR
    const anchor = mindarThree.addAnchor(0);
    anchor.group.add(chessGroup);

    anchor.onTargetFound = () => {
      statusTitle.textContent = "PIÈCE DÉTECTÉE";
      statusTitle.style.color = "#d4af37";
      statusDesc.textContent = "Pincez pour zoomer. Tournez la pièce pour inspecter le dessous.";
    };

    anchor.onTargetLost = () => {
      statusTitle.textContent = "RECHERCHE EN COURS";
      statusTitle.style.color = "#ffaa00";
      statusDesc.textContent = "Pointez la caméra vers l'image cible.";
    };

    // 5. ROTATION 360° ET ZOOM (PINCH / MOLETTE)
    let currentScale = 0.8;
    let isPointerDown = false;
    let lastPointerX = 0, lastPointerY = 0;
    let initialPinchDistance = null;

    function getTouchDistance(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    // Zoom molette
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      currentScale = Math.max(0.3, Math.min(3.0, currentScale * zoomFactor));
      chessGroup.scale.set(currentScale, currentScale, currentScale);
    }, { passive: false });

    // Contrôles tactiles mobiles
    window.addEventListener('touchstart', (e) => {
      if (e.target.id === 'start-btn') return;

      if (e.touches.length === 1) {
        isPointerDown = true;
        lastPointerX = e.touches[0].clientX;
        lastPointerY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isPointerDown = false;
        initialPinchDistance = getTouchDistance(e);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isPointerDown) {
        const dx = e.touches[0].clientX - lastPointerX;
        const dy = e.touches[0].clientY - lastPointerY;

        chessGroup.rotation.y += dx * 0.01;
        chessGroup.rotation.x += dy * 0.01;

        lastPointerX = e.touches[0].clientX;
        lastPointerY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const newDist = getTouchDistance(e);
        const factor = newDist / initialPinchDistance;
        initialPinchDistance = newDist;

        currentScale = Math.max(0.3, Math.min(3.0, currentScale * factor));
        chessGroup.scale.set(currentScale, currentScale, currentScale);
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) isPointerDown = false;
    });

    // Rotation à la souris
    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      if (e.target.id === 'start-btn') return;
      isMouseDown = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;

      chessGroup.rotation.y += dx * 0.01;
      chessGroup.rotation.x += dy * 0.01;

      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });

    // DÉMARRAGE
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      statusTitle.textContent = "CHARGEMENT";
      statusDesc.textContent = "Initialisation de la pièce 3D...";

      try {
        const response = await fetch('./targets.mind');
        if (!response.ok) throw new Error("Fichier 'targets.mind' introuvable.");

        await mindarThree.start();
        statusTitle.textContent = "RECHERCHE EN COURS";
        statusDesc.textContent = "Pointez la caméra vers l'image cible.";

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error(err);
        statusTitle.textContent = "ERREUR";
        statusTitle.style.color = "#ff4444";
        statusDesc.textContent = err.message;
      }
    });
  </script>
</body>
</html>
