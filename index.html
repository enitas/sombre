<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escape Game AR - Le Cavalier Mystère</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      touch-action: none;
    }
    body {
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 14px 20px;
      background: rgba(18, 14, 12, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 14px;
      color: #e2d1c3;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 10;
      pointer-events: none;
    }
    #status-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 4px;
    }
    #status-desc {
      font-size: 13px;
      color: #cbd5e1;
    }

    #start-btn {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      border-radius: 30px;
      color: #0d0f14;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      z-index: 10;
      pointer-events: auto;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div id="status-title">RECHERCHE EN COURS</div>
    <div id="status-desc">Pointez la caméra vers l'image cible.</div>
  </div>

  <button id="start-btn">DÉMARRER L'EXPÉRIENCE</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const startBtn = document.getElementById('start-btn');

    // 1. INITIALISATION MINDAR
    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind"
    });

    const { renderer, scene, camera } = mindarThree;

    // 2. ÉCLAIRAGE DE STUDIO HAUT DE GAMME
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff5ea, 2.5);
    keyLight.position.set(4, 6, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xd4af37, 2.0); // Lumière rasante dorée
    rimLight.position.set(-4, 3, -3);
    scene.add(rimLight);

    const bottomLight = new THREE.DirectionalLight(0xffeedd, 3.0); // Rétro-éclairage du socle
    bottomLight.position.set(0, -6, 0);
    scene.add(bottomLight);

    // 3. TEXTURE SOCLE AVEC GRAVURE
    function createBottomNumberTexture(numberStr) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Fond feutrine sombre
      ctx.fillStyle = '#11100e';
      ctx.beginPath();
      ctx.arc(256, 256, 250, 0, Math.PI * 2);
      ctx.fill();

      // Bague en or gravée
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 18;
      ctx.stroke();

      ctx.strokeStyle = '#8a6d1e';
      ctx.lineWidth = 4;
      ctx.arc(256, 256, 232, 0, Math.PI * 2);
      ctx.stroke();

      // Gravure des 3 chiffres
      const fontSize = numberStr.length >= 3 ? 130 : 190;
      ctx.fillStyle = '#f3e5ab';
      ctx.font = `Bold ${fontSize}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 10;
      ctx.fillText(numberStr, 256, 256);

      return new THREE.CanvasTexture(canvas);
    }

    // 4. CRÉATION DU CAVALIER PREMIUM (TÊTE DE CHEVAL SCULPTÉE)
    function createKnightPiece(secretNumber) {
      const knightGroup = new THREE.Group();

      // MATÉRIAUX LUXE
      // Ébène poli / Noir Onyx
      const ebonyMat = new THREE.MeshPhongMaterial({
        color: 0x18181c,
        specular: 0xaaaaaa,
        shininess: 90
      });

      // Or fin 24 Karats
      const goldMat = new THREE.MeshPhongMaterial({
        color: 0xd4af37,
        specular: 0xfff0aa,
        shininess: 100
      });

      // A. SOCLE TOURNÉ
      const basePoints = [];
      basePoints.push(new THREE.Vector2(0.36, 0.00));
      basePoints.push(new THREE.Vector2(0.36, 0.05));
      basePoints.push(new THREE.Vector2(0.32, 0.08));
      basePoints.push(new THREE.Vector2(0.28, 0.12));
      basePoints.push(new THREE.Vector2(0.22, 0.22));
      basePoints.push(new THREE.Vector2(0.24, 0.25));
      basePoints.push(new THREE.Vector2(0.19, 0.28));

      const baseGeo = new THREE.LatheGeometry(basePoints, 36);
      const baseMesh = new THREE.Mesh(baseGeo, ebonyMat);
      knightGroup.add(baseMesh);

      // Anneau en or sur le socle
      const ringGeo = new THREE.TorusGeometry(0.23, 0.015, 16, 36);
      const ringMesh = new THREE.Mesh(ringGeo, goldMat);
      ringMesh.rotation.x = Math.PI / 2;
      ringMesh.position.y = 0.235;
      knightGroup.add(ringMesh);

      // B. PROFIL TÊTE DE CHEVAL (SCULPTURE 3D EXTRUDÉE)
      const shape = new THREE.Shape();
      shape.moveTo(0.10, 0.26);
      
      // Dos du cou & crinière
      shape.bezierCurveTo(0.20, 0.38, 0.24, 0.52, 0.20, 0.68);
      shape.lineTo(0.23, 0.70); // Cran de crinière 1
      shape.lineTo(0.17, 0.74);
      shape.lineTo(0.20, 0.78); // Cran de crinière 2
      shape.lineTo(0.12, 0.82);

      // Oreilles
      shape.lineTo(0.10, 0.94); // Tip oreille arrière
      shape.lineTo(0.04, 0.86);
      shape.lineTo(0.02, 0.92); // Tip oreille avant
      shape.lineTo(-0.03, 0.83); // Sommet tête

      // Museau & Chanfrein
      shape.bezierCurveTo(-0.12, 0.78, -0.23, 0.66, -0.25, 0.52);
      shape.bezierCurveTo(-0.25, 0.44, -0.18, 0.41, -0.11, 0.44); // Bout du nez

      // Jawline / Mâchoire
      shape.lineTo(-0.06, 0.40); // Narine / bouche
      shape.bezierCurveTo(-0.12, 0.30, -0.02, 0.22, 0.05, 0.26); // Mâchoire & gorge
      shape.lineTo(0.10, 0.26);

      const extrudeSettings = {
        depth: 0.14,
        bevelEnabled: true,
        bevelSegments: 5,
        steps: 1,
        bevelSize: 0.025,
        bevelThickness: 0.025
      };

      const headGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      headGeo.center(); // Centrage géométrique
      
      const headMesh = new THREE.Mesh(headGeo, ebonyMat);
      headMesh.position.set(-0.02, 0.58, 0); // Positionnement sur le socle
      knightGroup.add(headMesh);

      // C. DÉTAILS EN OR (YEUX & MORS)
      // Yeux incrustés en or
      const eyeGeo = new THREE.SphereGeometry(0.018, 16, 16);
      const leftEye = new THREE.Mesh(eyeGeo, goldMat);
      leftEye.position.set(-0.08, 0.69, 0.085);
      const rightEye = new THREE.Mesh(eyeGeo, goldMat);
      rightEye.position.set(-0.08, 0.69, -0.085);
      knightGroup.add(leftEye, rightEye);

      // Mors doré
      const bitGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.20, 16);
      const bitMesh = new THREE.Mesh(bitGeo, goldMat);
      bitMesh.rotation.x = Math.PI / 2;
      bitMesh.position.set(-0.13, 0.46, 0);
      knightGroup.add(bitMesh);

      // D. DISQUE DU DESSOUS AVEC LES 3 CHIFFRES
      const bottomGeo = new THREE.CircleGeometry(0.35, 36);
      const numTexture = createBottomNumberTexture(secretNumber);
      const bottomMat = new THREE.MeshBasicMaterial({ map: numTexture, side: THREE.DoubleSide });
      const bottomMesh = new THREE.Mesh(bottomGeo, bottomMat);
      bottomMesh.rotation.x = Math.PI / 2;
      bottomMesh.position.y = 0.001;
      knightGroup.add(bottomMesh);

      // Centrer le pivot général au milieu de la pièce pour des rotations parfaites
      knightGroup.position.y = -0.35;

      return knightGroup;
    }

    // CODE SECRET À 3 CHIFFRES
    const SECRET_NUMBER = "314";
    const knightGroup = createKnightPiece(SECRET_NUMBER);
    knightGroup.scale.set(0.85, 0.85, 0.85);

    // ANCRAGE MINDAR
    const anchor = mindarThree.addAnchor(0);
    anchor.group.add(knightGroup);

    anchor.onTargetFound = () => {
      statusTitle.textContent = "CAVALIER DÉTECTÉ";
      statusTitle.style.color = "#d4af37";
      statusDesc.textContent = "Pincez pour zoomer. Tournez le cavalier pour voir en dessous.";
    };

    anchor.onTargetLost = () => {
      statusTitle.textContent = "RECHERCHE EN COURS";
      statusTitle.style.color = "#ffaa00";
      statusDesc.textContent = "Pointez la caméra vers l'image cible.";
    };

    // 5. NATIVITÉ TACTILE : ROTATION 360° ET ZOOM (PINCH / MOLETTE)
    let currentScale = 0.85;
    let isPointerDown = false;
    let lastPointerX = 0, lastPointerY = 0;
    let initialPinchDistance = null;

    function getTouchDistance(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    // Zoom à la molette
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      currentScale = Math.max(0.3, Math.min(3.5, currentScale * zoomFactor));
      knightGroup.scale.set(currentScale, currentScale, currentScale);
    }, { passive: false });

    // Contrôles tactiles (1 doigt = rotation 360°, 2 doigts = zoom)
    window.addEventListener('touchstart', (e) => {
      if (e.target.id === 'start-btn') return;

      if (e.touches.length === 1) {
        isPointerDown = true;
        lastPointerX = e.touches[0].clientX;
        lastPointerY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isPointerDown = false;
        initialPinchDistance = getTouchDistance(e);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isPointerDown) {
        const dx = e.touches[0].clientX - lastPointerX;
        const dy = e.touches[0].clientY - lastPointerY;

        // Rotation fluide sans restriction
        knightGroup.rotation.y += dx * 0.01;
        knightGroup.rotation.x += dy * 0.01;

        lastPointerX = e.touches[0].clientX;
        lastPointerY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const newDist = getTouchDistance(e);
        const factor = newDist / initialPinchDistance;
        initialPinchDistance = newDist;

        currentScale = Math.max(0.3, Math.min(3.5, currentScale * factor));
        knightGroup.scale.set(currentScale, currentScale, currentScale);
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) isPointerDown = false;
    });

    // Contrôle à la souris pour PC
    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      if (e.target.id === 'start-btn') return;
      isMouseDown = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;

      knightGroup.rotation.y += dx * 0.01;
      knightGroup.rotation.x += dy * 0.01;

      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });

    // DÉMARRAGE
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      statusTitle.textContent = "CHARGEMENT";
      statusDesc.textContent = "Initialisation du Cavalier 3D...";

      try {
        const response = await fetch('./targets.mind');
        if (!response.ok) throw new Error("Fichier 'targets.mind' introuvable.");

        await mindarThree.start();
        statusTitle.textContent = "RECHERCHE EN COURS";
        statusDesc.textContent = "Pointez la caméra vers l'image cible.";

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error(err);
        statusTitle.textContent = "ERREUR";
        statusTitle.style.color = "#ff4444";
        statusDesc.textContent = err.message;
      }
    });
  </script>
</body>
</html>
